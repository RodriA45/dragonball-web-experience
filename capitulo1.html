    <!-- CSS -->

    <style>
        /* Specific styles for Webtoon Reader */
        body {
            background-color: #000;
            overflow-x: hidden;
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            padding: 10px 20px;
            border-radius: 30px;
            color: #fff;
            text-decoration: none;
            border: 1px solid var(--accent-color);
            transition: all 0.3s;
            font-family: var(--font-main);
            font-weight: 700;
        }

        .back-btn:hover {
            background: var(--accent-color);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .webtoon-container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 50px;
            padding: 100px 0;
        }

        .comic-panel {
            position: relative;
            width: 100%;
            overflow: hidden;
            box-shadow: 0 15px 50px rgba(0,0,0,0.8);
        }

        .comic-img {
            width: 100%;
            display: block;
            /* Scale slightly for parallax zoom effect */
            transform: scale(1.1);
        }

        /* Speech Bubbles */
        .bubble {
            position: absolute;
            background: #fff;
            color: #000;
            padding: 15px 25px;
            border-radius: 30px;
            font-family: 'Comic Sans MS', 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 1.2rem;
            box-shadow: 5px 5px 0px rgba(0,0,0,0.5);
            opacity: 0;
            transform: scale(0.5);
            z-index: 10;
        }

        /* Tail of the bubble */
        .bubble::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 20px;
            border-width: 15px 15px 0;
            border-style: solid;
            border-color: #fff transparent transparent transparent;
        }

        /* Specific bubble positions */
        .bubble-1 { top: 10%; right: 10%; }
        .bubble-2 { bottom: 20%; left: 10%; border-radius: 5px; background: #000; color: #fff; box-shadow: 5px 5px 0px var(--accent-color); font-family: var(--font-display); font-size: 2rem;}
        .bubble-2::after { display: none; }
        .bubble-3 { top: 15%; right: 15%; font-size: 2rem; padding: 20px 40px;}

    </style>
</head>
<body>

    <!-- Loader -->
    <div id="loader" class="loader">
        <div class="loader-text">CARGANDO KI...</div>
        <div class="loader-bar"></div>
    </div>

            <div class="bubble bubble-1">Este lugar...</div>
        </div>

        <!-- Panel 2: The Eyes -->
        <div class="comic-panel panel-2">
            <img src="C:/Users/ridri/.gemini/antigravity-ide/brain/c07186e7-5e50-459c-9c4d-47789980c8bb/webtoon_panel_2_1790053574121.jpg" class="comic-img" alt="Goku abre los ojos">
            <div class="bubble bubble-2">¡Ese KI!</div>
        </div>

        <!-- Panel 3: Kamehameha -->
        <div class="comic-panel panel-3">
            <img src="C:/Users/ridri/.gemini/antigravity-ide/brain/c07186e7-5e50-459c-9c4d-47789980c8bb/webtoon_panel_3_1790053592531.jpg" class="comic-img" alt="Goku cargando Kamehameha">
